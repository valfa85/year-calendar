<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year Calendar</title>
<meta name="description" content="A compact year-at-a-glance calendar with ISO week numbers and England & Wales bank holidays.">

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<!-- Colour of the window's title bar / caption buttons when installed as an app -->
<meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202020" media="(prefers-color-scheme: dark)">
<script>
  // Apply a saved Light/Dark choice before the page draws, so it doesn't flash.
  try { var t = localStorage.getItem("yc-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<style>
/*
  Year Calendar 1.1: Windows 11 (Fluent) look in a web page.
  Colours are Windows 11's own light/dark values.
  The months are drawn at a fixed design size and zoomed to fit (4x3, 3x4, 2x6 or 6x2).
*/
:root {
  --base: #f3f3f3;                       /* window background (Mica stand-in) */
  --layer: rgba(255, 255, 255, 0.5);     /* lighter content layer */
  --layer-stroke: rgba(0, 0, 0, 0.0578);
  --text-1: rgba(0, 0, 0, 0.896);
  --text-2: rgba(0, 0, 0, 0.606);
  --text-3: rgba(0, 0, 0, 0.446);
  --text-4: rgba(0, 0, 0, 0.361);
  --subtle-hover: rgba(0, 0, 0, 0.0373);
  --subtle-press: rgba(0, 0, 0, 0.0241);
  --divider: rgba(0, 0, 0, 0.0803);
  --weekend: rgba(0, 0, 0, 0.035);
  --accent: #005fb8;
  --on-accent: #ffffff;
  --holiday: #0f7b0f;
  --holiday-bg: #dff6dd;
  --flyout: #f9f9f9;
  --flyout-stroke: rgba(0, 0, 0, 0.0578);
  --shadow: rgba(0, 0, 0, 0.14);
  --focus-outer: rgba(0, 0, 0, 0.896);
  --focus-inner: #ffffff;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
/* Dark: when Windows is dark (unless Light is chosen in the menu), or when Dark is chosen */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --base: #202020; --layer: rgba(58, 58, 58, 0.3); --layer-stroke: rgba(0, 0, 0, 0.1);
    --text-1: #ffffff; --text-2: rgba(255, 255, 255, 0.786); --text-3: rgba(255, 255, 255, 0.544); --text-4: rgba(255, 255, 255, 0.3628);
    --subtle-hover: rgba(255, 255, 255, 0.0605); --subtle-press: rgba(255, 255, 255, 0.0419);
    --divider: rgba(255, 255, 255, 0.0837); --weekend: rgba(255, 255, 255, 0.04);
    --accent: #60cdff; --on-accent: #000000; --holiday: #6ccb5f; --holiday-bg: #393d1b;
    --flyout: #2c2c2c; --flyout-stroke: rgba(0, 0, 0, 0.2); --shadow: rgba(0, 0, 0, 0.26);
    --focus-outer: #ffffff; --focus-inner: rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --base: #202020; --layer: rgba(58, 58, 58, 0.3); --layer-stroke: rgba(0, 0, 0, 0.1);
  --text-1: #ffffff; --text-2: rgba(255, 255, 255, 0.786); --text-3: rgba(255, 255, 255, 0.544); --text-4: rgba(255, 255, 255, 0.3628);
  --subtle-hover: rgba(255, 255, 255, 0.0605); --subtle-press: rgba(255, 255, 255, 0.0419);
  --divider: rgba(255, 255, 255, 0.0837); --weekend: rgba(255, 255, 255, 0.04);
  --accent: #60cdff; --on-accent: #000000; --holiday: #6ccb5f; --holiday-bg: #393d1b;
  --flyout: #2c2c2c; --flyout-stroke: rgba(0, 0, 0, 0.2); --shadow: rgba(0, 0, 0, 0.26);
  --focus-outer: #ffffff; --focus-inner: rgba(0, 0, 0, 0.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--base);
  color: var(--text-1);
  font-family: var(--font);
  font-size: 14px;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
[hidden] { display: none !important; }
.app { height: 100%; display: flex; flex-direction: column; }

/* Title bar strip: only shown when installed as an app with the title bar overlay */
.titlebar { display: none; }
@media (display-mode: window-controls-overlay) {
  .titlebar {
    display: flex; align-items: center; gap: 10px;
    position: fixed;
    left: env(titlebar-area-x, 0); top: env(titlebar-area-y, 0);
    width: env(titlebar-area-width, 100%); height: env(titlebar-area-height, 32px);
    padding-left: 14px;
    font-size: 12px; color: var(--text-1);
    app-region: drag; -webkit-app-region: drag;
  }
  .app { padding-top: env(titlebar-area-height, 32px); }
}
.titlebar svg { width: 16px; height: 16px; flex: none; }

/* Heading and toolbar */
header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 4px 8px 6px 20px;
  flex: none;
}
.heading { display: flex; align-items: center; gap: 10px; min-width: 0; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 28px; line-height: 36px; font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.toolbar { display: flex; align-items: center; gap: 2px; }
.btn {
  font: inherit; font-size: 14px; color: var(--text-1);
  background: transparent; border: 0; border-radius: 4px;
  height: 36px; min-width: 36px; padding: 0 9px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  cursor: default;
}
.btn:hover { background: var(--subtle-hover); }
.btn:active { background: var(--subtle-press); color: var(--text-2); }
.btn:focus-visible { outline: 2px solid var(--focus-outer); outline-offset: 1px; box-shadow: inset 0 0 0 1px var(--focus-inner); }
.btn svg { width: 16px; height: 16px; flex: none; }
.sep { width: 1px; height: 20px; background: var(--divider); margin: 0 6px; }

/* "More options" menu (Windows 11 menu flyout style) */
.more { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 20;
  min-width: 220px; padding: 4px;
  display: flex; flex-direction: column; gap: 2px;
  background: var(--flyout); border: 1px solid var(--flyout-stroke); border-radius: 8px;
  box-shadow: 0 8px 16px var(--shadow);
}
.mi {
  font: inherit; font-size: 14px; color: var(--text-1);
  background: transparent; border: 0; border-radius: 4px;
  height: 32px; padding: 0 14px 0 10px;
  display: flex; align-items: center; gap: 10px;
  text-align: left; white-space: nowrap; cursor: default;
}
.mi:hover, .mi:focus-visible { background: var(--subtle-hover); }
.mi:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--focus-outer); }
.mi svg { width: 16px; height: 16px; flex: none; visibility: hidden; }
.mi[aria-checked="true"] svg { visibility: visible; }
.msep { height: 1px; background: var(--divider); margin: 3px -4px; }
.mlabel { font-size: 12px; color: var(--text-2); padding: 6px 10px 2px 36px; }
.mver { font-size: 12px; color: var(--text-3); padding: 6px 10px 6px 36px; }

/* Content layer */
.stage {
  flex: 1; min-height: 0;
  background: var(--layer);
  border-top: 1px solid var(--layer-stroke);
  overflow: hidden;
  position: relative;
}

.yearview {
  height: 100%;
  display: flex; align-items: center; justify-content: center;
  padding: 10px 16px 14px;
}
.months {
  display: grid;
  column-gap: 28px; row-gap: 14px;
  grid-template-columns: repeat(var(--cols, 4), 212px);
}
.month {
  width: 212px; height: 196px;
  display: grid;
  grid-template-columns: 24px repeat(7, 26px);
  grid-template-rows: 28px 20px repeat(6, 24px);
  justify-content: center;
  font-variant-numeric: tabular-nums;
}
.no-weeks .month { grid-template-columns: 0 repeat(7, 26px); }
.no-weeks .wk { visibility: hidden; }
.month h2 {
  grid-column: 2 / span 7; margin: 0 0 0 6px; align-self: center;
  font-size: 14px; font-weight: 600; color: var(--text-1);
}
.dh { font-size: 11px; color: var(--text-2); display: grid; place-items: center; }
.dh.we { font-weight: 700; }
.wk { font-size: 10px; color: var(--text-3); display: flex; align-items: center; overflow: hidden; }
.d { display: grid; place-items: center; font-size: 12px; color: var(--text-1); position: relative; z-index: 0; }
.d.we { color: var(--text-2); background: var(--weekend); }  /* shading only on real weekend days */
.d.we:not(.out) { font-weight: 700; }  /* this month's Saturdays and Sundays in bold */
.d.out { color: var(--text-4); }  /* days from the previous/next month */
.d.out { font-weight: 400; }
.d.hol { color: var(--holiday); font-weight: 600; }
.d.today { color: var(--on-accent); font-weight: 600; }
.d.hol::before, .d.today::before {
  content: ""; position: absolute; z-index: -1;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--holiday-bg);
}
.d.today::before { background: var(--accent); }

/* Holiday tooltip (Fluent style) */
.tip {
  position: fixed; z-index: 10; pointer-events: none;
  background: var(--flyout); color: var(--text-1);
  border: 1px solid var(--flyout-stroke); border-radius: 4px;
  padding: 5px 8px 7px; font-size: 12px; max-width: 280px;
  box-shadow: 0 4px 8px var(--shadow);
}

@media (prefers-reduced-motion: no-preference) {
  .btn, .mi { transition: background-color 83ms linear; }
}
</style>
</head>

<div class="app">
  <div class="titlebar" aria-hidden="true">
    <svg viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="13" rx="2.5" fill="#f4f7fb" stroke="#8aa0b8" stroke-width=".6"/><path d="M3.5 2h9A2.5 2.5 0 0 1 15 4.5V6H1V4.5A2.5 2.5 0 0 1 3.5 2z" fill="#0f6cbd"/><rect x="4.2" y="1" width="1.6" height="3" rx=".8" fill="#0b4f94"/><rect x="10.2" y="1" width="1.6" height="3" rx=".8" fill="#0b4f94"/><rect x="3" y="7.5" width="2.6" height="2.4" rx=".6" fill="#afc0d4"/><rect x="6.7" y="7.5" width="2.6" height="2.4" rx=".6" fill="#afc0d4"/><rect x="10.4" y="7.5" width="2.6" height="2.4" rx=".6" fill="#afc0d4"/><rect x="3" y="11" width="2.6" height="2.4" rx=".6" fill="#afc0d4"/><rect x="6.7" y="11" width="2.6" height="2.4" rx=".6" fill="#0f6cbd"/><rect x="10.4" y="11" width="2.6" height="2.4" rx=".6" fill="#afc0d4"/></svg>
    <span>Year Calendar</span>

  <header id="header">

      <h1 id="title">2026</h1>

    <div class="toolbar" role="toolbar" aria-label="Calendar">

        Today

      <button class="btn" id="next">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.75 3.5 10.25 8l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <div class="more">
        <button class="btn" id="moreBtn" title="More options" aria-label="More options" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.2" fill="currentColor"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/><circle cx="13" cy="8" r="1.2" fill="currentColor"/></svg>
        </button>
        <div class="menu" id="menu" role="menu" aria-label="Options" hidden>
          <button class="mi" id="optHols" role="menuitemcheckbox" aria-checked="true"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Show UK bank holidays</button>
          <button class="mi" id="optWeeks" role="menuitemcheckbox" aria-checked="true"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Show week numbers</button>
          <div class="msep" role="separator"></div>
          <div class="mlabel" aria-hidden="true">Theme</div>
          <div role="group" aria-label="Theme" style="display:contents">
            <button class="mi" id="themeSystem" role="menuitemradio" aria-checked="true" data-theme-choice="system"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="currentColor"/></svg>Follow Windows</button>
            <button class="mi" id="themeLight" role="menuitemradio" aria-checked="false" data-theme-choice="light"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="currentColor"/></svg>Light</button>
            <button class="mi" id="themeDark" role="menuitemradio" aria-checked="false" data-theme-choice="dark"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="currentColor"/></svg>Dark</button>
          </div>
          <div class="msep" role="separator"></div>
          <div class="mver" id="version">Year Calendar</div>
        </div>
      </div>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="yearview" id="yearview">
      <div class="months" id="months"></div>
    </div>
  </main>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>

<noscript>Year Calendar needs JavaScript switched on.</noscript>

<script>
"use strict";
const VERSION = "1.2";

/* ---------- Dates (all in UTC so time zones and clock changes can't shift a day) ---------- */
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAY_LETTERS = ["M","T","W","T","F","S","S"];
const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const utc = (y, m, d) => new Date(Date.UTC(y, m, d));            // m is 0-11
const addDays = (date, n) => new Date(date.getTime() + n * 86400000);
const mondayIndex = date => (date.getUTCDay() + 6) % 7;          // Monday = 0 ... Sunday = 6
const key = date => date.getUTCFullYear() + "-" + (date.getUTCMonth() + 1) + "-" + date.getUTCDate();
const daysIn = (y, m) => utc(y, m + 1, 0).getUTCDate();

/** ISO 8601 week number (weeks start Monday; week 1 contains the year's first Thursday). */
function isoWeek(date) {
  const thursday = addDays(date, 3 - mondayIndex(date));
  const jan1 = utc(thursday.getUTCFullYear(), 0, 1);
  return Math.floor((thursday - jan1) / 86400000 / 7) + 1;
}

/** Easter Sunday (anonymous Gregorian algorithm). */
function easterSunday(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  return utc(y, Math.floor((h + l - 7 * m + 114) / 31) - 1, ((h + l - 7 * m + 114) % 31) + 1);
}

/* ---------- England & Wales bank holidays (checked against gov.uk/bank-holidays, 2019-2028) ---------- */
const FIRST_HOLIDAY_YEAR = 1978; // the full modern set dates from 1978; earlier years show none
const ONE_OFFS = [
  [1981, 6, 29, "Royal wedding (Prince Charles and Lady Diana Spencer)"],
  [1999, 11, 31, "Millennium celebrations"],
  [2002, 5, 3, "Golden Jubilee of Queen Elizabeth II"],
  [2011, 3, 29, "Royal wedding (Prince William and Catherine Middleton)"],
  [2012, 5, 5, "Diamond Jubilee of Queen Elizabeth II"],
  [2022, 5, 3, "Platinum Jubilee bank holiday"],
  [2022, 8, 19, "State Funeral of Queen Elizabeth II"],
  [2023, 4, 8, "Coronation of King Charles III"],
  // Add future one-off bank holidays here: [year, month (0 = January), day, "Name"],
];
const MOVED_EARLY_MAY = { 1995: [4, 8], 2020: [4, 8] };            // VE Day anniversaries
const MOVED_SPRING = { 2002: [5, 4], 2012: [5, 4], 2022: [5, 2] };  // jubilees

const nextMonday = date => addDays(date, (7 - mondayIndex(date)) % 7);
const lastMonday = (y, m) => { const last = utc(y, m, daysIn(y, m)); return addDays(last, -mondayIndex(last)); };

function bankHolidays(y) {
  const out = new Map();
  if (y < FIRST_HOLIDAY_YEAR) return out;
  const add = (date, name) => out.set(key(date), name);

  const newYear = utc(y, 0, 1);
  if (mondayIndex(newYear) >= 5) add(nextMonday(newYear), "New Year's Day (substitute day)");
  else add(newYear, "New Year's Day");

  const easter = easterSunday(y);
  add(addDays(easter, -2), "Good Friday");
  add(addDays(easter, 1), "Easter Monday");

  if (MOVED_EARLY_MAY[y]) add(utc(y, ...MOVED_EARLY_MAY[y]), "Early May bank holiday (VE Day)");
  else add(nextMonday(utc(y, 4, 1)), "Early May bank holiday");

  add(MOVED_SPRING[y] ? utc(y, ...MOVED_SPRING[y]) : lastMonday(y, 4), "Spring bank holiday");
  add(lastMonday(y, 7), "Summer bank holiday");

  switch (utc(y, 11, 25).getUTCDay()) {
    case 5: add(utc(y, 11, 25), "Christmas Day"); add(utc(y, 11, 28), "Boxing Day (substitute day)"); break;
    case 6: add(utc(y, 11, 27), "Christmas Day (substitute day)"); add(utc(y, 11, 28), "Boxing Day (substitute day)"); break;
    case 0: add(utc(y, 11, 26), "Boxing Day"); add(utc(y, 11, 27), "Christmas Day (substitute day)"); break;
    default: add(utc(y, 11, 25), "Christmas Day"); add(utc(y, 11, 26), "Boxing Day");
  }

  for (const [oy, om, od, name] of ONE_OFFS) if (oy === y) add(utc(oy, om, od), name);
  return out;
}


/* ---------- State ---------- */
const $ = id => document.getElementById(id);
const monthsEl = $("months"), yearViewEl = $("yearview"), stageEl = $("stage"), tip = $("tip"), titleEl = $("title");
const prevBtn = $("prev"), nextBtn = $("next"), todayBtn = $("today");
const moreBtn = $("moreBtn"), menu = $("menu"), optHols = $("optHols"), optWeeks = $("optWeeks");
const themeItems = [$("themeSystem"), $("themeLight"), $("themeDark")];
const todayLocal = () => { const n = new Date(); return utc(n.getFullYear(), n.getMonth(), n.getDate()); };

// Options are remembered on this PC (localStorage); if storage isn't available, defaults are used.
function load(name, fallback) { try { const v = localStorage.getItem(name); return v === null ? fallback : v; } catch (e) { return fallback; } }
function save(name, value) { try { localStorage.setItem(name, value); } catch (e) {} }

let today = todayLocal();
let year = today.getUTCFullYear();
let showWeeks = load("yc-weeks", "1") !== "0";
let showHols = load("yc-hols", "1") !== "0";
let theme = load("yc-theme", "system");

$("version").textContent = "Year Calendar " + VERSION;
prevBtn.title = "Previous year (Left)"; prevBtn.setAttribute("aria-label", "Previous year");
nextBtn.title = "Next year (Right)"; nextBtn.setAttribute("aria-label", "Next year");
todayBtn.title = "Go to this year (T)";

/* ---------- Drawing ---------- */
function dayLabel(date, isToday, holiday) {
  return DAY_NAMES[date.getUTCDay()] + " " + date.getUTCDate() + " " + MONTHS[date.getUTCMonth()] + " " +
         date.getUTCFullYear() + (isToday ? ", today" : "") + (holiday ? ", " + holiday : "");
}

function render() {
  titleEl.textContent = year;
  document.title = "Year Calendar – " + year;
  optHols.setAttribute("aria-checked", String(showHols));
  optWeeks.setAttribute("aria-checked", String(showWeeks));
  for (const item of themeItems) item.setAttribute("aria-checked", String(item.dataset.themeChoice === theme));
  hideTip();

  const holidays = showHols ? bankHolidays(year) : new Map();
  const todayKey = key(today);
  let html = "";

  for (let m = 0; m < 12; m++) {
    html += '<section class="month" aria-label="' + MONTHS[m] + " " + year + '"><h2>' + MONTHS[m] + "</h2>";
    html += "<span></span>" + DAY_LETTERS.map((l, i) => '<span class="dh' + (i >= 5 ? " we" : "") + '">' + l + "</span>").join("");

    const count = daysIn(year, m);
    let day = 1 - mondayIndex(utc(year, m, 1));
    for (let row = 0; row < 6; row++) {
      html += '<span class="wk">' + (day <= count ? isoWeek(utc(year, m, Math.max(day, 1))) : "") + "</span>";
      for (let col = 0; col < 7; col++, day++) {
        const rowStarted = day - col <= count;
        if (!rowStarted) { html += "<span></span>"; continue; }
        const date = utc(year, m, day); // Date.UTC rolls day 0, -1... back into the previous month and 32... into the next
        if (day < 1 || day > count) {
          // Fill the first and last week with the neighbouring months' days, faded
          html += '<span class="d out' + (col >= 5 ? " we" : "") + '" aria-hidden="true">' + date.getUTCDate() + "</span>";
          continue;
        }
        const k = key(date), name = holidays.get(k), isToday = k === todayKey;
        const cls = "d" + (col >= 5 ? " we" : "") + (isToday ? " today" : name ? " hol" : "");
        html += '<span class="' + cls + '" aria-label="' + dayLabel(date, isToday, name) + '"' +
                (name ? ' data-hol="' + name + '"' : "") + ">" + day + "</span>";
      }
    }
    html += "</section>";
  }
  monthsEl.innerHTML = html;
  monthsEl.classList.toggle("no-weeks", !showWeeks);
  fit();
}

/* ---------- Fit the months to the window ---------- */
const MONTH_W = 212, MONTH_H = 196, GAP_X = 28, GAP_Y = 14;
const LAYOUTS = [[4, 3], [3, 4], [2, 6], [6, 2]];

function fit() {
  const style = getComputedStyle(yearViewEl);
  const w = yearViewEl.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
  const h = yearViewEl.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
  if (w <= 0 || h <= 0) return;
  let best = LAYOUTS[0], bestScale = 0;
  for (const [cols, rows] of LAYOUTS) {
    const s = Math.min(w / (cols * MONTH_W + (cols - 1) * GAP_X), h / (rows * MONTH_H + (rows - 1) * GAP_Y));
    if (s > bestScale) { bestScale = s; best = [cols, rows]; }
  }
  monthsEl.style.setProperty("--cols", best[0]);
  monthsEl.style.zoom = bestScale; // zoom re-lays out text at the new size, so it stays sharp
}
new ResizeObserver(fit).observe(stageEl);

/* ---------- Year navigation ---------- */
function changeYear(delta) {
  const next = year + delta;
  if (next < 1 || next > 9999) return;
  year = next;
  render();
}
function goToToday() {
  today = todayLocal();
  year = today.getUTCFullYear();
  render();
}

prevBtn.addEventListener("click", () => changeYear(-1));
nextBtn.addEventListener("click", () => changeYear(+1));
todayBtn.addEventListener("click", goToToday);

document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (!menu.hidden) { if (e.key === "Escape") closeMenu(true); return; } // keys belong to the menu while it's open
  switch (e.key) {
    case "ArrowLeft": case "ArrowUp": case "PageUp": changeYear(-1); break;
    case "ArrowRight": case "ArrowDown": case "PageDown": changeYear(+1); break;
    case "t": case "T": case "Home": goToToday(); break;
    default: return;
  }
  e.preventDefault();
});

/* ---------- Theme ---------- */
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  const root = document.documentElement;
  if (theme === "light" || theme === "dark") root.setAttribute("data-theme", theme);
  else root.removeAttribute("data-theme");
  const dark = theme === "dark" || (theme === "system" && darkQuery.matches);
  // Title bar / caption buttons follow this colour when installed as an app
  for (const meta of document.querySelectorAll('meta[name="theme-color"]')) meta.content = dark ? "#202020" : "#f3f3f3";
}
darkQuery.addEventListener("change", applyTheme);

/* ---------- More options menu ---------- */
const menuItems = [optHols, optWeeks, ...themeItems];
function openMenu(focusFirst) {
  menu.hidden = false;
  moreBtn.setAttribute("aria-expanded", "true");
  hideTip();
  if (focusFirst) menuItems[0].focus();
}
function closeMenu(returnFocus) {
  if (menu.hidden) return;
  menu.hidden = true;
  moreBtn.setAttribute("aria-expanded", "false");
  if (returnFocus) moreBtn.focus();
}
// e.detail is 0 when a button is pressed with the keyboard rather than clicked
moreBtn.addEventListener("click", e => { if (menu.hidden) openMenu(e.detail === 0); else closeMenu(false); });
optHols.addEventListener("click", e => {
  showHols = !showHols; save("yc-hols", showHols ? "1" : "0");
  render(); closeMenu(e.detail === 0);
});
optWeeks.addEventListener("click", e => {
  showWeeks = !showWeeks; save("yc-weeks", showWeeks ? "1" : "0");
  render(); closeMenu(e.detail === 0);
});
for (const item of themeItems) {
  item.addEventListener("click", e => {
    theme = item.dataset.themeChoice; save("yc-theme", theme);
    applyTheme(); render(); closeMenu(e.detail === 0);
  });
}
menu.addEventListener("keydown", e => {
  const i = menuItems.indexOf(document.activeElement);
  if (e.key === "ArrowDown") menuItems[(i + 1) % menuItems.length].focus();
  else if (e.key === "ArrowUp") menuItems[(i - 1 + menuItems.length) % menuItems.length].focus();
  else if (e.key === "Home") menuItems[0].focus();
  else if (e.key === "End") menuItems[menuItems.length - 1].focus();
  else if (e.key === "Escape") closeMenu(true);
  else if (e.key === "Tab") { closeMenu(false); return; }
  else return;
  e.preventDefault();
  e.stopPropagation();
});
document.addEventListener("pointerdown", e => { if (!e.target.closest(".more")) closeMenu(false); });
window.addEventListener("blur", () => closeMenu(false));

/* ---------- Holiday tooltip ---------- */
function hideTip() { tip.hidden = true; }
monthsEl.addEventListener("mouseover", e => {
  const cell = e.target.closest("[data-hol]");
  if (!cell || !menu.hidden) { hideTip(); return; }
  tip.textContent = cell.dataset.hol;
  tip.hidden = false;
  const r = cell.getBoundingClientRect(), t = tip.getBoundingClientRect();
  let left = r.left + r.width / 2 - t.width / 2;
  left = Math.max(8, Math.min(left, innerWidth - t.width - 8));
  let top = r.top - t.height - 8;
  if (top < 8) top = r.bottom + 8;
  tip.style.left = left + "px";
  tip.style.top = top + "px";
});
monthsEl.addEventListener("mouseleave", hideTip);

/* ---------- Keep "today" right if left open past midnight ---------- */
setInterval(() => {
  const now = todayLocal();
  if (now.getTime() !== today.getTime()) { today = now; render(); }
}, 60000);

applyTheme();
render();

/* ---------- Work offline once installed ---------- */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
